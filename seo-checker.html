<script type="text/babel">
const { useState, useRef } = React;
const { motion, AnimatePresence } = window.Motion;
const EASE = [0.22, 1, 0.36, 1];

/* ---------------- Inline icons (lucide-style) ---------------- */
const Ico = {
  ArrowUpRight: (p) => <svg width={p.size||22} height={p.size||22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={p.sw||2} strokeLinecap="round" strokeLinejoin="round" className={p.className} aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>,
  Search:  (p) => <svg width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
  Gauge:   (p) => <svg width={p.size||22} height={p.size||22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>,
  Sparkles:(p) => <svg width={p.size||22} height={p.size||22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M9.94 14.06 8 20l-1.94-5.94L0 12l6.06-2.06L8 4l1.94 5.94L16 12z"/><path d="M19 3v4"/><path d="M21 5h-4"/></svg>,
  Smartphone:(p)=> <svg width={p.size||22} height={p.size||22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>,
  Link:    (p) => <svg width={p.size||22} height={p.size||22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>,
  FileText:(p) => <svg width={p.size||22} height={p.size||22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>,
  Check:   (p) => <svg width={p.size||16} height={p.size||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>,
  Alert:   (p) => <svg width={p.size||16} height={p.size||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
  Music2:  (p) => <svg width={p.size||16} height={p.size||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="8" cy="18" r="4"/><path d="M12 18V2l7 4"/></svg>,
  Facebook:(p) => <svg width={p.size||16} height={p.size||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>,
  Instagram:(p)=> <svg width={p.size||16} height={p.size||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>,
  Linkedin:(p) => <svg width={p.size||16} height={p.size||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>,
};

/* ---------------- Score ring ---------------- */
function ScoreRing({ value, size = 132, stroke = 9, show }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const pct = show ? value / 100 : 0;
  const color = value >= 80 ? '#A06BF5' : value >= 55 ? '#7B3FE4' : '#5E0ED7';
  return (
    <div className="relative" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90">
        <circle className="score-track" cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={stroke} />
        <circle className="score-prog" cx={size/2} cy={size/2} r={r} fill="none" stroke={color}
                strokeWidth={stroke} strokeDasharray={c} strokeDashoffset={c - c*pct} />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <span className="font-firs font-semibold text-white leading-none" style={{ fontSize: size*0.30 }}>{show ? value : 0}</span>
        <span className="text-[10px] tracking-[0.22em] uppercase text-white/45 mt-1">/ 100</span>
      </div>
    </div>
  );
}

/* ---------------- Category card ---------------- */
function MetricCard({ icon: I, label, score, note, show, delay }) {
  const color = score >= 80 ? '#A06BF5' : score >= 55 ? '#C9A6FF' : '#F0B5B5';
  return (
    <motion.div
      initial={{ opacity: 0, y: 24 }}
      animate={show ? { opacity: 1, y: 0 } : {}}
      transition={{ duration: 0.6, delay, ease: EASE }}
      className="liquid-glass rounded-2xl p-5 flex flex-col gap-3">
      <div className="flex items-center justify-between">
        <span className="w-9 h-9 rounded-full flex items-center justify-center text-accent2" style={{ background:'rgba(160,107,245,0.12)' }}><I size={18} /></span>
        <span className="font-firs text-2xl font-semibold" style={{ color }}>{show && score != null ? score : '—'}</span>
      </div>
      <div>
        <p className="text-[11px] uppercase tracking-[0.18em] text-white/45">{label}</p>
        <p className="text-[13px] text-white/70 leading-snug mt-1">{note}</p>
      </div>
    </motion.div>
  );
}

/* ---------------- Real audit: Google PageSpeed Insights (Lighthouse, mobile) ---------------- */
const PSI_KEY = 'AIzaSyCSaOv6sadyZgHqGmzrgwNzWgSo_xRj2_g'; // optional: paste a free Google API key here for a higher daily scan limit
const pct = (s) => (s == null ? null : Math.round(s * 100));
const avg = (arr) => { const v = arr.filter((x) => x != null); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; };
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

const METRIC_SHELL = [
  { icon: Ico.Gauge,      label: 'Performance' },
  { icon: Ico.FileText,   label: 'On-Page SEO' },
  { icon: Ico.Smartphone, label: 'Accessibility' },
  { icon: Ico.Sparkles,   label: 'Best Practices' },
  { icon: Ico.Search,     label: 'Indexing' },
  { icon: Ico.Link,       label: 'Security' },
];

function normalizeUrl(raw) {
  let s = (raw || '').trim();
  if (!s) return null;
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  try { const u = new URL(s); return u.hostname.includes('.') ? u.href : null; } catch (e) { return null; }
}

async function runAudit(url) {
  const qs = new URLSearchParams({ url, strategy: 'mobile' });
  ['performance', 'seo', 'accessibility', 'best-practices'].forEach((c) => qs.append('category', c));
  if (PSI_KEY) qs.set('key', PSI_KEY);
  let res;
  try { res = await fetch('https://www.googleapis.com/pagespeedonline/v5/runPagespeed?' + qs.toString()); }
  catch (e) { throw new Error("Couldn't reach Google's scanner. Check your connection and try again."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.lighthouseResult) {
    const msg = (data.error && data.error.message) || '';
    if (res.status === 429) throw new Error('The free scanner is busy right now. Try again in a minute.');
    if (/DOCUMENT_REQUEST|DNS|NO_FCP|NOT_HTML|unreachable/i.test(msg)) throw new Error("We couldn't load that site. Double-check the address.");
    throw new Error('Scan failed. Double-check the address and try again.');
  }
  return summarize(data.lighthouseResult);
}

function summarize(lh) {
  const A = lh.audits || {}, C = lh.categories || {};
  const sc = (id) => (A[id] && A[id].score != null ? A[id].score : null);
  const cat = (k) => pct(C[k] && C[k].score);
  const failing = (k) => ((C[k] && C[k].auditRefs) || []).filter((r) => r.weight > 0 && sc(r.id) != null && sc(r.id) < 1).length;

  const perf = cat('performance'), seo = cat('seo'), acc = cat('accessibility'), bp = cat('best-practices');
  const indexing = avg(['is-crawlable', 'robots-txt', 'http-status-code', 'canonical', 'crawlable-anchors'].map((id) => pct(sc(id))));
  const https = sc('is-on-https');
  const security = avg([pct(https), pct(sc('redirects-http'))]);
  const lcp = A['largest-contentful-paint'];
  const lcpSec = lcp && lcp.numericValue ? (lcp.numericValue / 1000).toFixed(1) : null;
  const seoFails = failing('seo'), accFails = failing('accessibility'), bpFails = failing('best-practices');

  const metrics = [
    { ...METRIC_SHELL[0], score: perf, note: lcpSec ? ('Main content loads in ' + lcpSec + 's on mobile' + (lcpSec <= 2.5 ? ' — fast.' : ' — Google wants under 2.5s.')) : 'Mobile speed score from Google.' },
    { ...METRIC_SHELL[1], score: seo, note: seoFails ? (plural(seoFails, 'on-page check') + ' failing — see the list.') : 'Every on-page SEO check passes.' },
    { ...METRIC_SHELL[2], score: acc, note: accFails ? (plural(accFails, 'issue') + ' that can block visitors.') : 'No accessibility issues found.' },
    { ...METRIC_SHELL[3], score: bp, note: bpFails ? (plural(bpFails, 'technical issue') + ' found.') : 'Follows modern web best practices.' },
    { ...METRIC_SHELL[4], score: indexing, note: sc('is-crawlable') === 0 ? 'Something is blocking Google from indexing this page.' : 'Google can crawl and index this page.' },
    { ...METRIC_SHELL[5], score: security, note: https === 1 ? 'Served securely over HTTPS.' : 'Not secure — the site is missing HTTPS.' },
  ];

  const ids = ['is-on-https', 'viewport', 'document-title', 'meta-description', 'largest-contentful-paint', 'image-alt', 'link-text', 'is-crawlable', 'robots-txt', 'canonical', 'http-status-code', 'hreflang'];
  const checks = ids
    .filter((id) => A[id] && A[id].score != null && A[id].scoreDisplayMode !== 'notApplicable')
    .map((id) => {
      const okv = id === 'largest-contentful-paint' ? A[id].score >= 0.9 : A[id].score === 1;
      const t = id === 'largest-contentful-paint' ? ('Largest Contentful Paint: ' + (A[id].displayValue || '')) : A[id].title.replace(/`/g, '');
      return { ok: okv, t };
    })
    .sort((x, y) => Number(x.ok) - Number(y.ok))
    .slice(0, 8);

  const overall = avg([perf, seo, acc, bp]) || 0;
  const fixes = checks.filter((c) => !c.ok).length;
  const verdict = overall >= 90 ? ['Strong', 'Your basics are solid. Let’s push you to the top spot.']
    : overall >= 70 ? ['Decent — fixable', fixes ? ('You’re leaving rankings on the table. ' + plural(fixes, 'quick fix') + ' below.') : 'Good foundation with room to grow.']
    : overall >= 50 ? ['Needs work', 'Customers are likely finding competitors first. Start with the red flags below.']
    : ['Losing customers', 'Google is holding this site back. The red flags below are costing you calls.'];

  return { overall, metrics, checks, verdict, finalUrl: lh.finalDisplayedUrl || lh.finalUrl || lh.requestedUrl };
}

/* ---------------- The checker tool ---------------- */
function Checker() {
  const [url, setUrl] = useState('');
  const [state, setState] = useState('idle'); // idle | scanning | done | error
  const [result, setResult] = useState(null);
  const [err, setErr] = useState('');

  const run = async () => {
    if (state === 'scanning') return;
    const target = normalizeUrl(url);
    if (!target) { setErr('Enter a website address, like yourbusiness.com'); setState('error'); return; }
    setErr(''); setResult(null); setState('scanning');
    try {
      const r = await runAudit(target);
      setResult(r); setState('done');
    } catch (e) {
      setErr(e.message || 'Scan failed. Try again.'); setState('error');
    }
  };

  const show = state === 'done' && !!result;
  const overall = result ? result.overall : 0;
  const metrics = result ? result.metrics : METRIC_SHELL.map((m) => ({ ...m, score: null, note: 'Scanning…' }));
  const checks = result ? result.checks : [];

  return (
    <section className="w-full">
      {/* Hero copy */}
      <motion.div
        initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }}
        transition={{ duration: 0.9, ease: EASE }}
        className="text-center max-w-3xl mx-auto">
        <p className="text-[11px] sm:text-xs font-semibold tracking-[0.28em] uppercase text-accent2/90">Free Instant Audit</p>
        <h1 className="font-firs mt-5 uppercase font-semibold tracking-tight leading-[0.92] text-white" style={{ fontSize: 'clamp(2.6rem, 7vw, 5.4rem)' }}>
          See where you <span className="grad-text">rank</span>
        </h1>
        <p className="mt-6 text-[17px] sm:text-[19px] leading-[1.5] text-white/70">
          Drop in your URL. We'll run a live Google scan of your speed, on-page SEO, accessibility, and
          <span className="font-serif italic text-white"> indexing</span> — results in under a minute.
        </p>
      </motion.div>

      {/* Input bar */}
      <motion.div
        initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }}
        transition={{ duration: 0.9, delay: 0.15, ease: EASE }}
        className={"liquid-glass rounded-2xl mt-10 max-w-2xl mx-auto p-2.5 flex items-center gap-2 " + (state==='scanning' ? 'scanning' : '')}>
        <span className="pl-3 text-white/45"><Ico.Search size={20} /></span>
        <input
          value={url}
          onChange={(e) => setUrl(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && run()}
          placeholder="yourbusiness.com"
          className="flex-1 bg-transparent outline-none text-white placeholder-white/35 text-[16px] sm:text-[17px] py-3" />
        <button onClick={run}
          className="cta-group clip-btn shrink-0 inline-flex items-center gap-2 bg-white text-black px-5 sm:px-6 py-3 text-[15px] font-semibold uppercase tracking-wide hover:bg-white/90 transition-colors">
          {state === 'scanning' ? 'Scanning…' : 'Check'}
          {state !== 'scanning' && <Ico.ArrowUpRight size={18} className="cta-arrow" />}
        </button>
      </motion.div>
      {state === 'error'
        ? <p role="alert" className="text-center text-[14px] text-rose-200 mt-4">{err}</p>
        : <p className="text-center text-[12px] text-white/50 mt-4 tracking-wide">{state === 'scanning' ? 'Running a live Google Lighthouse scan on mobile — usually 20–40 seconds…' : 'No signup • No card • Live scan powered by Google Lighthouse'}</p>}
      {show && result.finalUrl && (
        <p className="text-center text-[13px] text-white/60 mt-2">Results for <span className="text-white">{result.finalUrl}</span></p>
      )}

      {/* Results */}
      <AnimatePresence>
        {(state === 'scanning' || state === 'done') && (
          <motion.div
            initial={{ opacity: 0, y: 40 }} animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.8, ease: EASE }}
            className="mt-14 grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">

            {/* Overall + wins */}
            <div className="liquid-glass rounded-3xl p-7 lg:col-span-1 flex flex-col items-center">
              <div className="relative">
                <ScoreRing value={overall} show={show} />
                {state === 'scanning' && (
                  <div className="absolute inset-0 overflow-hidden rounded-full pointer-events-none">
                    <div className="scan-bar absolute left-0 right-0 h-1/3" style={{ background:'linear-gradient(to bottom, rgba(160,107,245,0), rgba(160,107,245,0.5), rgba(160,107,245,0))' }}></div>
                  </div>
                )}
              </div>
              <p className="font-firs text-lg font-semibold text-white mt-4 uppercase tracking-wide">{show ? result.verdict[0] : 'Analyzing…'}</p>
              <p className="text-[13px] text-white/60 text-center mt-1 max-w-[230px]">{show ? result.verdict[1] : 'Loading your site & scoring signals.'}</p>

              <div className="w-full mt-6 flex flex-col gap-2.5">
                {checks.map((w, i) => (
                  <motion.div key={i}
                    initial={{ opacity: 0, x: -10 }}
                    animate={show ? { opacity: 1, x: 0 } : {}}
                    transition={{ duration: 0.4, delay: 0.3 + i*0.08, ease: EASE }}
                    className="flex items-start gap-2.5 text-[13px] min-w-0">
                    <span className={"mt-0.5 shrink-0 " + (w.ok ? 'text-accent2' : 'text-rose-300/80')}>{w.ok ? <Ico.Check/> : <Ico.Alert/>}</span>
                    <span className={"min-w-0 " + (w.ok ? 'text-white/75' : 'text-white/60')}>{w.t}</span>
                  </motion.div>
                ))}
              </div>
            </div>

            {/* Category grid */}
            <div className="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-5">
              {metrics.map((m, i) => (
                <MetricCard key={m.label} icon={m.icon} label={m.label} score={m.score} note={m.note} show={show} delay={0.25 + i*0.08} />
              ))}
              <div className="sm:col-span-2 liquid-glass rounded-2xl p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-5">
                <div>

                </a>
              </div>
            </div>
          </motion.div>
        )}
      </AnimatePresence>
    </section>
  );
